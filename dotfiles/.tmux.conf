# ~/.tmux.conf
# inspired from -- https://github.com/gpakosz/.tmux
#
# URLs to read:
#
#   http://blog.yjl.im/2009/11/migrating-to-tmux-from-gnuscreen.html
#   http://blog.hawkhost.com/2010/06/28/tmux-the-terminal-multiplexer/
#   http://blog.hawkhost.com/2010/07/02/tmux-%E2%80%93-the-terminal-multiplexer-part-2/
#   http://www.dayid.org/os/notes/tm.html
#
# Other sample tmux.conf files
#
#   http://www.mindfuzz.net/?p=178
#
#
# -----------------------------------------------------------------------------
# Prefix setup
set -g   prefix2        C-a
bind C-a send-prefix    -2
# -----------------------------------------------------------------------------
# retain ctrl-a
unbind a
bind a   send-key       Home
# -----------------------------------------------------------------------------
# experimenting...
# -----------------------------------------------------------------------------
bind -n M-Left          select-pane -L
bind -n M-Right         select-pane -R
unbind M-j
bind -n M-j            select-pane -U
unbind M-k
bind -n M-k          select-pane -D
## -----------------------------------------------------------------------------
## Global settings
##set -s  escape-time         10               # faster command sequences
set -sg escape-time         0
##set -sg  repeat-time         600              # increase repeat timeout
set -g  display-time        1000
set -s focus-events         on
#
set -g  default-terminal    "screen-256color"
set -g  default-shell       "/bin/zsh"

set -g  set-titles          on               # enable wm window titles
set -g  history-limit       90000
set -g  bell-action         any               # listen for activity on all windows
set -g  base-index          0
set -qg utf8                on
set -qg status-utf8         on
set -g monitor-activity on
set -g visual-activity off


set -g renumber-windows on    # renumber windows when a window is closed

# default statusbar colors
set -g status-keys          vi
# command/message line colors
set -g status-style fg=white
set -g status-style bg=default
set -g message-style fg=white
set -g message-style bg=black
set -ga terminal-overrides ",*-256color:Tc" ## delta
#set -g status-attr default
#set -g message-bg black
#set -g message-bg black
#set -g message-fg white
#set -g message-attr bright

# -----------------------------------------------------------------------------
# Window settings
setw -g xterm-keys on # xterm-style function key sequences
setw -g automatic-rename on   # rename window to reflect current program
setw -g mode-keys vi # vi-style controls for copy mode
# default window title colors
#setw -g window-status-fg white
#setw -g window-status-bg default
#setw -g window-status-attr dim
# active window title colors
#setw -g window-status-current-fg white
#setw -g window-status-current-bg default
#setw -g window-status-current-attr underscore #bright

# useful
bind C-a last-window
bind-key R source-file ~/.tmux.conf \; display 'Reloading...' # reload settings
bind d detach # detach client
bind D choose-client # choose a client to detach
bind w choose-window # choose window
bind '"' choose-session # choose session
bind "'" display-panes
bind k confirm-before kill-pane
bind K confirm-before kill-window
bind A command-prompt "rename-window %%"
bind * list-clients
# copying and pasting
bind [ copy-mode
bind ] paste-buffer -s \015
# toggle statusbar
bind s set status
bind - split-window -v
bind | split-window -h
bind r refresh-client
bind c new-window
bind N next-layout

bind -r Space next-window
bind -r BSpace previous-window

# features
bind / command-prompt "split-window 'exec man %%'"
bind \~ split-window "exec htop"

# quit
bind '\' confirm-before kill-server

